services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gene-keys-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode >= 500 ? 1 : 0))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
