meta:
  environment: node
  toolchain:
    name: npm
    version: 22

build:
  # Amvera автоматически выполняет npm install.
  # Дополнительно гарантируем установку всех зависимостей, не запуская долгий `next build`:
  additionalCommands: npm install --include=dev

run:
  # В runtime-контейнере Amvera доступен стандартный npm (глобальный pnpm отсутствует в runtime).
  # `npm run bot:dev` выполняет `tsx scripts/dev-bot.ts` в режиме Long Polling.
  command: pnpm run bot:dev

